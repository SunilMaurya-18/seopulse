spring:
  application:
    name: seopulse-backend

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/seopulse}
      username: ${DB_USERNAME:seopulse}
      password: ${DB_PASSWORD:seopulse_dev_password}
      driver-class-name: org.postgresql.Driver


  jpa:
    open-in-view: false

    hibernate:
       ddl-auto: validate

    properties:
       hibernate:
         format_sql: true



    flyway:
      enabled: true

    spring:
      data:
        web:
          pageable:
            default-page-size: 20
            max-page-size: 100

    springdoc:
      swagger-ui:
        path: /swagger-ui.html
      api-docs:
        path: /v3/api-docs

    jwt:
      secret:
        ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}

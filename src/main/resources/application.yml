spring:
  application:
    name: seopulse-backend

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/seopulse}
      username: ${DB_USERNAME:seopulse}
      password: ${DB_PASSWORD:seopulse_dev_password}
      driver-class-name: org.postgresql.Driver


  jpa:
    open-in-view: false

    hibernate:
       ddl-auto: validate

    properties:
       hibernate:
         format_sql: true



    flyway:
      enabled: true
      locations: classpath:db/migration

    spring:
      data:
        web:
          pageable:
            default-page-size: 20
            max-page-size: 100
        redis:
          host: ${REDIS_HOST:localhost}
          port: ${REDIS_PORT:6379}

    springdoc:
      swagger-ui:
        path: /swagger-ui.html
      api-docs:
        path: /v3/api-docs

    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}

    seopulse:
      crawler:
        max-pages: 500
        max-depth: 5
        connect-timeout-ms: 10000
        max-body-size-bytes: 5000000
        user-agent: "SEOPulseBot/1.0 (+https://seopulse.example.com/bot)"
        respect-robots-txt: true